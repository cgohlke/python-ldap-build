name: Build python-ldap wheels for Windows

on:
  workflow_dispatch:

env:
  OPENSSL_VER: openssl-3.5.9
  OPENLDAP_VER: openldap-2.4.59
  PYTHONLDAP_VER: python-ldap-3.4.8
  CIBW_TEST_COMMAND: python -c"import ldap;print(ldap.__version__)"
  CIBW_SKIP: "cp39* cp310* cp311*"
  MSBUILDTREATHIGHERTOOLSVERSIONASCURRENT: 1

jobs:
  build_amd64:
    name: Build AMD64 wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    env:
      VS_PLATFORM: x64
      VS_PLATFORM_TOOLSET: v145
      VC_VER: 18.0
      OPENSSL_CONFIG: VC-WIN64A-masm
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - run: build_openssl.cmd
        shell: cmd
      - run: build_openldap.cmd
        shell: cmd
      - run: build_python-ldap.cmd
        shell: cmd
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_WINDOWS: AMD64
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-win-amd64
  build_x86:
    name: Build x86 wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    env:
      VS_PLATFORM: Win32
      VS_PLATFORM_TOOLSET: v145
      VC_VER: 18.0
      OPENSSL_CONFIG: VC-WIN32
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
      - uses: ilammy/setup-nasm@v1
      - run: build_openssl.cmd
        shell: cmd
      - run: build_openldap.cmd
        shell: cmd
      - run: build_python-ldap.cmd
        shell: cmd
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_WINDOWS: x86
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-win32
  build_arm64:
    name: Build ARM64 wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-11-arm]
    env:
      VS_PLATFORM: ARM64
      VS_PLATFORM_TOOLSET: v145
      VC_VER: 18.0
      OPENSSL_CONFIG: VC-WIN64-ARM
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - run: build_openssl.cmd
        shell: cmd
      - run: build_openldap.cmd
        shell: cmd
      - run: build_python-ldap.cmd
        shell: cmd
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_WINDOWS: ARM64
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-win-arm64
